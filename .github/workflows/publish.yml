name: Publish FolderPin

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Compile
        run: pnpm run compile

      - name: Package extension
        run: pnpm exec vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish *.vsix -p ${{ secrets.VSCE_TOKEN }}

      - name: Create Open VSX namespace
        run: pnpm exec ovsx create-namespace souravrax -p ${{ secrets.OVSX_TOKEN }}
        continue-on-error: true

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish *.vsix -p ${{ secrets.OVSX_TOKEN }}
